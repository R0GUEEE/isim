# One-off probe (not part of the release pipeline): the arm64 runner's toolchain and the Swift tarball's checksum.
name: probe-arm
on:
  push:
    branches: [arm64]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: swift aarch64 tarball
        run: |
          u=https://download.swift.org/swift-6.2.4-release/ubuntu2404-aarch64/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE-ubuntu24.04-aarch64.tar.gz
          curl -fsSL -o /tmp/s.tar.gz "$u"
          ls -l /tmp/s.tar.gz; echo "SHA256: $(sha256sum /tmp/s.tar.gz | cut -d' ' -f1)"
      - name: packages
        run: |
          sudo apt-get update -qq
          for p in libcairo2-dev libpango1.0-dev librsvg2-dev libgdk-pixbuf-2.0-dev libfontconfig-dev libwebkitgtk-6.0-dev libgtk-4-dev tesseract-ocr zxing-cpp-tools qrencode liblouis20 espeak-ng ffmpeg libegl1-mesa-dev libpulse-dev; do
            printf '%s: ' "$p"; apt-cache policy "$p" 2>/dev/null | sed -n 's/  Candidate: //p' | head -1
          done
