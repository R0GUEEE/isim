# One test, one crash report: the arm64 port's runtime work is judged by running guest code, and this prints why an app
# dies without waiting for the whole suite.
name: arm64-debug
on:
  push:
    branches: [arm64]
    paths-ignore: ['.github/workflows/arm64.yml', 'docs/**', '**/*.md']
  workflow_dispatch:
jobs:
  one:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: CI image
        uses: docker/build-push-action@v7
        with:
          context: isim/ci
          load: true
          tags: isim-ci
          cache-from: type=gha,scope=arm64-ci
      - name: Build (from the last arm64 build)
        uses: actions/cache/restore@v5
        with:
          path: |
            isim/out
            !isim/out/pytest
            !isim/out/test-*
          key: build-arm64-nocache
          restore-keys: build-arm64-
      - name: Swift toolchain
        uses: actions/cache/restore@v5
        with:
          path: ~/swift-toolchain
          key: swift-6.2.4-ubuntu24.04-aarch64      # arm64.yml's SWIFT_KEY
      - name: GDB direct reproduction
        run: |
          cat > /tmp/repro.sh <<'SH'
          set +e
          cd /work
          apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq gdb >/dev/null 2>&1
          mkdir -p /tmp/isim-data
          export ISIM_DATA=/tmp/isim-data ISIM_STANDALONE=1 ISIM_MDNS=0 ISIM_AASA_FETCH=0
          export ISIM_GAMECENTER=/tmp/gamecenter ISIM_SHAREPLAY=/tmp/shareplay ISIM_GAMESAVE=/tmp/gamesave
          gdb -batch \
              -ex 'set breakpoint pending on' \
              -ex 'break pthread_setspecific if $x0 == 0 && $x1 == 1' \
              -ex 'commands 1' -ex 'silent' -ex 'printf "\n=== pthread_setspecific(key=0,value=1) ===\n"' \
              -ex 'info symbol $pc' -ex 'bt 6' -ex 'continue' -ex 'end' \
              -ex run \
              -ex 'printf "\n=== fault symbol / instruction ===\n"' -ex 'info symbol $pc' -ex 'x/12i $pc-24' \
              -ex 'printf "\n=== fault addr / runtime TLS ===\n"' -ex 'p/x $_siginfo._sifields._sigfault.si_addr' \
              -ex 'p treg_key' -ex 'p ntregs' -ex 'p captregs' -ex 'p tregs[0]' \
              -ex 'info proc mappings' \
              -ex 'printf "\n=== registers / backtrace ===\n"' \
              -ex 'info registers x0 x1 x2 x3 x4 x5 x6 x7 x8 x9 x10 x11 x12 x13 x14 x15 x16 x17 x18 x19 x20 x21 x22 x23 x24 x25 x26 x27 x28 x29 x30 sp pc' \
              -ex 'x/12gx $sp' -ex 'bt 24' --args isim/out/bin/isim-runtime --root isim/out/sdk isim/out/apps/UTTypesTest.app/UTTypesTest \
              > /tmp/repro-gdb.txt 2>&1
          echo "=== direct GDB repro ==="; cat /tmp/repro-gdb.txt
          SH
          docker run --rm -v "$PWD:/work" -w /work -v /tmp/repro.sh:/tmp/repro.sh isim-ci sh /tmp/repro.sh || true
      - name: One test
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -v "$HOME/swift-toolchain:$HOME/swift-toolchain:ro" -e ISIM_SWIFT_TOOLCHAIN="$HOME/swift-toolchain" \
            -e CI=1 -e ISIM_WAIT_SCALE=3 isim-ci python3 isim/build.py test -k "uttypes" || true
      - name: Crash reports
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" isim/out || true
          find isim/out -name '*.ips' | head -3 | while read -r f; do
            echo "=== $f"; sed -n '1,2p' "$f" | cut -c1-400; python3 isim/ci/crash-summary.py "$f"
          done
